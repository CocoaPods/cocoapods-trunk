name: Specs

permissions:
  contents: read

jobs:
  specs:
    strategy:
      fail-fast: false
      matrix:
        task: [SPECS]
        ruby: ['2.7', '3.1']
        os: [ubuntu-24.04]
        include:
          - task: SPECS
            os: macos-15
            ruby: system

    name: ${{ matrix.task }} / ${{ matrix.os }} / Ruby ${{ matrix.ruby }}
    runs-on: ${{ matrix.os }}

    steps:
      - name: Checkout git
        uses: actions/checkout@v7

      - name: Set up Ruby
        if: matrix.ruby != 'system'
        uses: ruby/setup-ruby@v1
        with:
          ruby-version: ${{ matrix.ruby }}
          bundler-cache: true

      # The macOS runner image puts a newer Ruby first on PATH, so explicitly
      # switch to Apple's /usr/bin/ruby and install gems somewhere writable.
      - name: Set up macOS system Ruby
        if: matrix.ruby == 'system'
        run: |
          echo "GEM_HOME=$HOME/.gem/system-ruby" >> "$GITHUB_ENV"
          echo "BUNDLE_PATH=$GITHUB_WORKSPACE/vendor/bundle" >> "$GITHUB_ENV"
          echo "/usr/bin" >> "$GITHUB_PATH"
          echo "$HOME/.gem/system-ruby/bin" >> "$GITHUB_PATH"

      # Gemfile.lock pins gems that require Ruby >= 2.7, so resolve fresh,
      # the same way a user installing on the system Ruby would.
      - name: Install gems (system Ruby)
        if: matrix.ruby == 'system'
        run: |
          which ruby && ruby -v
          rm Gemfile.lock
          gem install bundler -v '~> 2.4.0' --no-document
          bundle install --jobs 4 --retry 3

      - name: Set up git identity
        run: |
          git config --global user.email "tests@cocoapods.org"
          git config --global user.name "CocoaPods Tests"

      - name: Run Tests
        run: bundle exec rake spec
        env:
          COCOAPODS_CI_TASKS: ${{ matrix.task }}

on:
  push:
    branches:
      - "master"
      - "*-stable"
  pull_request:
    branches:
      - master
      - "*-stable"
